name: Market Auto Snapshot

on:
  # 直接按交易所收盘后的本地时间触发，GitHub Actions 支持 IANA timezone，避免美股夏令时错位。
  # 其中每个市场每天三次：T+2h / T+2.5h / T+3h。
  schedule:
    - cron: '0 17 * * MON-FRI'
      timezone: 'Asia/Shanghai'
    - cron: '30 17 * * MON-FRI'
      timezone: 'Asia/Shanghai'
    - cron: '0 18 * * MON-FRI'
      timezone: 'Asia/Shanghai'
    - cron: '0 18 * * 1-5'
      timezone: 'America/New_York'
    - cron: '30 18 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 19 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:

jobs:
  fetch-a:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 17 * * MON-FRI' || github.event.schedule == '30 17 * * MON-FRI' || github.event.schedule == '0 18 * * MON-FRI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch A-share snapshot
        id: fetch
        continue-on-error: true
        run: python3 market_fetch.py --market A
      - name: Commit A-share snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-auto.json
          git diff --cached --quiet || git commit -m "chore: update A-share market snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Surface fetch failure (after commit is safely pushed)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "抓取脚本本次报告了错误，已经把 fetch_errors 记录并提交到 data/market-auto.json，前端会显示醒目提醒。这一步只是让本次 workflow 在列表里显示为失败，方便你注意到——具体原因请看上面 'Fetch A-share snapshot' 步骤的日志。"
          exit 1

  fetch-us:
    # [P2修复] 加 needs: fetch-a，强制两个job排队执行，而不是并发同时改同一个data/market-auto.json。
    # 之前两个job并发运行时，谁先push谁就把远程往前推一步，后完成的那个job虽然加了
    # git pull --rebase，但如果两边改的是文件里相邻/重叠的内容（比如都要改顶层generated_at字段），
    # 依然会产生真正的文本冲突导致rebase失败——需要靠严格排队而不是"事后补救"来根治。
    # if 里的 always() 是必须的：否则只要 fetch-a 因为脚本抓取失败而整体标记为失败，
    # fetch-us 会被GitHub Actions默认跳过，即使美股这边完全没问题也不会运行。
    needs: fetch-a
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 1-5' || github.event.schedule == '30 18 * * 1-5' || github.event.schedule == '0 19 * * 1-5')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch US snapshot
        id: fetch
        continue-on-error: true
        run: python3 market_fetch.py --market US
      - name: Commit US snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-auto.json
          git diff --cached --quiet || git commit -m "chore: update US market snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Surface fetch failure (after commit is safely pushed)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "抓取脚本本次报告了错误，已经把 fetch_errors 记录并提交到 data/market-auto.json，前端会显示醒目提醒。这一步只是让本次 workflow 在列表里显示为失败，方便你注意到——具体原因请看上面 'Fetch US snapshot' 步骤的日志。"
          exit 1
